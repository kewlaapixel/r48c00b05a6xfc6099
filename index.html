<style>
:root {
  --mag: #e02ad0; --cy: #31c7d8; --ind: #5b3df5; --ink: #f4f1ff; --mut: #aaa4d8; --line: rgba(150, 120, 255, .35);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse 70% 60% at 62% 46%, #251b82 0%, #150d52 48%, #08072a 100%);
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  overflow-x: hidden;
}
#mua0dl { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
#mua0dl::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 3, 20, .65) 100%); }
.sh { position: absolute; color: var(--c); animation: drift var(--d) ease-in-out infinite alternate; }
.sh.dash { height: 4px; border-radius: 4px; background: currentColor; box-shadow: 0 0 10px currentColor; }
.sh svg { display: block; overflow: visible; }
@keyframes drift {
  from { transform: translate3d(-8px, -10px, 0) rotate(var(--r)); }
  to   { transform: translate3d(10px, 12px, 0) rotate(calc(var(--r) + 8deg)); }
}

main {
  position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 22px; padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
}
.brand { margin: 0; text-align: center; transform: rotate(-4deg); line-height: .9; user-select: none; }
.brand .we {
  display: block; font: italic 900 clamp(20px, 5vw, 30px)/1 "Arial Black", Impact, system-ui, sans-serif;
  color: #fff; text-transform: lowercase; letter-spacing: .02em; transform: skewX(-10deg);
  text-shadow: -2px 2px 0 var(--mag), 2px 2px 0 var(--cy); margin-bottom: 4px;
}
.brand .name {
  display: block; font: italic 900 clamp(34px, 10vw, 64px)/1 Impact, "Arial Black", "Haettenschweiler", system-ui, sans-serif;
  color: #fff; letter-spacing: -.01em; transform: skewX(-10deg);
  text-shadow: -3px 3px 0 var(--mag), 3px 3px 0 var(--cy);
}

.card {
  width: min(100%, 420px); padding: 22px 20px 18px; border-radius: 18px;
  background: linear-gradient(180deg, rgba(25, 17, 84, .78), rgba(12, 8, 46, .84));
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid var(--line); box-shadow: 0 0 0 1px rgba(224, 42, 208, .12), 0 18px 60px rgba(4, 2, 30, .6), 0 0 40px rgba(91, 61, 245, .25);
}
.box { padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(8, 6, 40, .35); transition: opacity .25s, border-color .25s, box-shadow .25s; }
.box + .box { margin-top: 12px; }
.box.off { opacity: .5; }
.box.done { opacity: .6; }
.box.on { border-color: rgba(224, 42, 208, .6); box-shadow: 0 0 20px rgba(224, 42, 208, .16); }
#k3yujo.on { border-color: rgba(49, 199, 216, .6); box-shadow: 0 0 20px rgba(49, 199, 216, .16); }
.box .left { margin-bottom: 10px; }
.box .bar { margin: 12px 0 6px; }
.lbl { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--cy); }
.code {
  font: 700 clamp(28px, 9vw, 40px)/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em;
  text-align: center; padding: 14px 6px 14px 14px; border-radius: 12px; background: rgba(8, 6, 40, .7);
  border: 1px solid rgba(49, 199, 216, .45); box-shadow: inset 0 0 22px rgba(49, 199, 216, .12), 0 0 18px rgba(49, 199, 216, .18);
  user-select: all; -webkit-user-select: all;
}
.bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .1); margin: 14px 0 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--mag), var(--cy)); transform-origin: left; }
.left { margin: 0 0 14px; font-size: 12.5px; color: var(--mut); text-align: right; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  flex: 1 1 140px; min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(91, 61, 245, .22); color: var(--ink); font-family: inherit; font-weight: 600; font-size: 15px; line-height: 1; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
}
.btn:hover { background: rgba(91, 61, 245, .38); }
.btn.primary { background: linear-gradient(90deg, #c321b6, #2aa9ba); border-color: transparent; color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.btn.primary:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
.failt { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #ff8aa8; }
.hint { margin: 16px 0 0; font-size: 14px; color: var(--mut); display: flex; gap: 10px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cy); box-shadow: 0 0 10px var(--cy); animation: pulse 1.2s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
input#tbcipn {
  width: 100%; height: 62px; text-align: center; font: 700 32px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: .3em; padding-left: .3em; color: var(--ink); background: rgba(8, 6, 40, .7);
  border: 1px solid rgba(224, 42, 208, .55); border-radius: 12px; box-shadow: inset 0 0 22px rgba(224, 42, 208, .1);
}
input#tbcipn::placeholder { color: rgba(170, 164, 216, .4); }
.msg:empty { display: none; }
.msg { margin: 12px 0 0; font-size: 14px; text-align: center; color: var(--mut); }
.msg.err { color: #ff8aa8; } .msg.ok { color: #7ff0c0; }
[hidden] { display: none !important; }
.mnt { text-align: center; padding: 6px 0 2px; }
.mnt .gear { width: 56px; height: 56px; color: var(--cy); animation: spin 8s linear infinite; }
.mnt .gear.s { width: 28px; height: 28px; color: var(--mag, #e02ad0); animation-direction: reverse; position: relative; left: -10px; top: 8px; }
.mnt h2 { margin: 12px 0 6px; font-size: 19px; font-weight: 700; color: var(--ink); }
.mnt p { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--mut); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sh, .dot, .gear { animation: none; } }
</style>
